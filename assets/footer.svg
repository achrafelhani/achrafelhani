<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 72" width="1200" height="72" role="img" aria-label="Achraf El Hani — loop closed.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .pulse { animation: run 7s linear infinite; }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes run { 0% { transform: translateX(0); opacity: 0; } 5%, 95% { opacity: 1; } 100% { transform: translateX(600px); opacity: 0; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .pulse, .caret { animation: none; } .pulse { opacity: 0; } }
  </style>
  <rect width="1200" height="72" rx="14" fill="#0a101c"/>
  <rect x=".5" y=".5" width="1199" height="71" rx="14" fill="none" stroke="#1d2a3e"/>
  <text class="mono" x="40" y="41" font-size="13" letter-spacing="3" fill="#7f93ad">ACHRAF EL HANI</text>
  <path d="M300 36H900" stroke="#22324a" stroke-width="1.5"/>
  <rect class="pulse" x="300" y="34.5" width="26" height="3" rx="1.5" fill="#38d6ff"/>
  <text class="mono" x="1146" y="41" text-anchor="end" font-size="13" letter-spacing="3" fill="#f2c14e">LOOP CLOSED</text>
  <rect class="caret" x="1152" y="29" width="8" height="15" fill="#f2c14e"/>
</svg>
