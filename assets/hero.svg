<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Achraf El Hani — Industrial and Software Engineering. Closing the loop between machines and software.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mask { transform: translateX(560px); animation: type 12s infinite; animation-timing-function: steps(48, end); }
    .caretm { transform: translateX(548px); animation: carm 12s infinite; animation-timing-function: steps(48, end); }
    .caret { animation: blink 1s steps(1) infinite; }
    .trace { stroke-dasharray: 1000; stroke-dashoffset: 0; animation: draw 12s ease-out infinite; }
    .area { opacity: 1; animation: area 12s linear infinite; }
    .flow { stroke-dasharray: 5 9; animation: flow 1.4s linear infinite; }
    .shine { transform: translateX(-140px) skewX(-18deg); animation: shine 8s ease-in-out infinite; }
    .scan { animation: scan 10s linear infinite; }
    .led { animation: led 2.4s ease-in-out infinite; }
    @keyframes type { 0% { transform: translateX(0); } 28%, 100% { transform: translateX(560px); } }
    @keyframes carm { 0% { transform: translateX(0); } 28%, 100% { transform: translateX(548px); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes draw { 0% { stroke-dashoffset: 1000; opacity: 1; } 38%, 92% { stroke-dashoffset: 0; opacity: 1; } 98% { stroke-dashoffset: 0; opacity: 0; } 100% { stroke-dashoffset: 1000; opacity: 0; } }
    @keyframes area { 0%, 30% { opacity: 0; } 45%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes flow { to { stroke-dashoffset: -14; } }
    @keyframes shine { 0%, 55% { transform: translateX(-140px) skewX(-18deg); } 80%, 100% { transform: translateX(820px) skewX(-18deg); } }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(480px); } }
    @keyframes led { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      .mask, .caretm, .caret, .trace, .area, .flow, .shine, .scan, .led { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="480" rx="16"/></clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9fd8ff" stroke-opacity=".05"/>
    </pattern>
    <pattern id="ruler" width="120" height="12" patternUnits="userSpaceOnUse">
      <path d="M.5 0V12M24.5 5V12M48.5 5V12M72.5 5V12M96.5 5V12" stroke="#5b7391" stroke-opacity=".7"/>
    </pattern>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38d6ff" stop-opacity=".20"/><stop offset="1" stop-color="#38d6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3b6cff" stop-opacity=".16"/><stop offset="1" stop-color="#3b6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfe6ff"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38d6ff" stop-opacity=".22"/><stop offset="1" stop-color="#38d6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="tclip"><text class="sans" x="72" y="204" font-size="84" font-weight="800" textLength="660" lengthAdjust="spacingAndGlyphs">ACHRAF EL HANI</text></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="480" fill="#0a101c"/>

    <!-- typed signature (drawn first so its mask stays invisible) -->
    <text class="mono" x="72" y="292" font-size="19" fill="#d7e6f7" textLength="548" lengthAdjust="spacing"><tspan fill="#f2c14e">&gt;</tspan> closing the loop between machines and software</text>
    <rect class="mask" x="68" y="270" width="560" height="32" fill="#0a101c"/>
    <g class="caretm"><rect class="caret" x="80" y="275" width="10" height="21" fill="#38d6ff"/></g>

    <!-- depth: glows + grid -->
    <circle cx="960" cy="200" r="340" fill="url(#glowA)"/>
    <circle cx="240" cy="470" r="380" fill="url(#glowB)"/>
    <rect width="1200" height="480" fill="url(#grid)"/>
    <rect class="scan" y="-3" width="1200" height="3" fill="#bfe6ff" fill-opacity=".05"/>

    <!-- top bar -->
    <g class="mono" font-size="13" letter-spacing="1.5" fill="#7f93ad">
      <circle class="led" cx="78" cy="42" r="4" fill="#f2c14e"/>
      <text x="92" y="46.5">achrafelhani</text>
      <text x="1128" y="46.5" text-anchor="end">43.30°N 5.37°E · MARSEILLE, FR</text>
    </g>
    <path d="M72 66H1128" stroke="#1d2a3e"/>

    <!-- title -->
    <text class="sans" x="72" y="204" font-size="84" font-weight="800" fill="url(#title)" textLength="660" lengthAdjust="spacingAndGlyphs">ACHRAF EL HANI</text>
    <g clip-path="url(#tclip)"><rect class="shine" x="0" y="120" width="110" height="110" fill="url(#fadeR)"/></g>
    <text class="mono" x="74" y="246" font-size="19" letter-spacing="5" fill="#38d6ff">INDUSTRIAL &amp; SOFTWARE ENGINEERING</text>

    <!-- FIG. 1: closed-loop block diagram -->
    <g class="mono">
      <text x="780" y="128" font-size="11" letter-spacing="2" fill="#5b7391">FIG. 1 — CLOSED LOOP</text>
      <g fill="none" stroke-width="1.6">
        <path class="flow" d="M780 176H817" stroke="#f2c14e"/>
        <g stroke="#38d6ff" stroke-opacity=".85">
