      <path d="M826 176h12M832 170v12" stroke="#f2c14e" stroke-width="1.6"/>
      <g fill="#0f1b2d" stroke="#2f5377" stroke-width="1.4">
        <rect x="872" y="154" width="96" height="44" rx="6"/>
        <rect x="1004" y="154" width="96" height="44" rx="6"/>
        <rect x="918" y="224" width="96" height="44" rx="6"/>
      </g>
